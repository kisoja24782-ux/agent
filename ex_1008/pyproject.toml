[project]
name = "ex-1008"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kisoja24782-ux", email = "kisoja24782@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docx2txt>=0.9",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.7",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ex-1008 = "ex_1008:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "colorama>=0.4.6",
    "langgraph-cli[inmem]>=0.4.33",
]
